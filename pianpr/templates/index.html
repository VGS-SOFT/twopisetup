<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANPR Live Feed</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      gap: 1.25rem;
    }
    h1 { font-size: 1.3rem; letter-spacing: 0.05em; color: #fff; }

    /* ── video player ── */
    #videoWrap {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16/9;
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    video {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }
    #status {
      position: absolute;
      top: 8px; left: 12px;
      font-size: 0.75rem;
      background: rgba(0,0,0,0.6);
      padding: 2px 8px;
      border-radius: 4px;
      color: #ffcc00;
    }

    /* ── manual play button (shown only when autoplay blocked) ── */
    #playBtn {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      width: 64px; height: 64px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
    #playBtn svg { width: 28px; height: 28px; fill: #fff; }

    /* ── stats bar ── */
    #stats {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.75rem;
    }
    .stat {
      background: #1c1c1c;
      border-radius: 6px;
      padding: 0.6rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label { font-size: 0.65rem; color: #888; text-transform: uppercase; letter-spacing: 0.06em; }
    .stat-value { font-size: 1.1rem; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }

    /* ── detections log ── */
    #log {
      width: 100%;
      max-width: 720px;
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
    }
    #log h2 { padding: 0.6rem 1rem; font-size: 0.8rem; color: #888; background: #141414; letter-spacing: 0.05em; }
    #log ul { list-style: none; max-height: 200px; overflow-y: auto; padding: 0.5rem 0; }
    #log li {
      padding: 0.35rem 1rem;
      font-size: 0.85rem;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
    }
    #log li .plate { color: #4fc3f7; font-weight: 600; letter-spacing: 0.08em; }
    #log li .conf  { color: #888; font-size: 0.75rem; }
  </style>
</head>
<body>
  <h1>ANPR LIVE FEED</h1>

  <div id="videoWrap">
    <video id="vid" autoplay playsinline muted></video>
    <span id="status">Connecting…</span>
    <!-- shown only if browser blocks autoplay -->
    <button id="playBtn" aria-label="Play">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <div id="stats">
    <div class="stat"><span class="stat-label">FPS</span><span class="stat-value" id="sFps">0.0 fps</span></div>
    <div class="stat"><span class="stat-label">Latency</span><span class="stat-value" id="sLat">—</span></div>
    <div class="stat"><span class="stat-label">Packets lost</span><span class="stat-value" id="sLoss">0</span></div>
    <div class="stat"><span class="stat-label">Bitrate in</span><span class="stat-value" id="sBr">—</span></div>
    <div class="stat"><span class="stat-label">Jitter</span><span class="stat-value" id="sJit">—</span></div>
    <div class="stat"><span class="stat-label">Resolution</span><span class="stat-value" id="sRes">—x—</span></div>
  </div>

  <div id="log">
    <h2>DETECTED PLATES</h2>
    <ul id="plateLog"></ul>
  </div>

<script>
// ── WebRTC WHEP connection to MediaMTX ────────────────────────
const WHEP_URL = `http://${location.hostname}:8889/gate/whep`;
const video    = document.getElementById('vid');
const status   = document.getElementById('status');
const playBtn  = document.getElementById('playBtn');

let pc;
let statsStarted = false;

// ── attempt to play; show manual button if browser blocks it ──
function tryPlay() {
  video.play().then(() => {
    playBtn.style.display = 'none';
  }).catch(() => {
    // autoplay blocked — show the play button so user can tap once
    playBtn.style.display = 'flex';
  });
}

playBtn.addEventListener('click', () => {
  video.play();
  playBtn.style.display = 'none';
});

async function startWebRTC() {
  if (pc) {
    pc.close();
    pc = null;
    statsStarted = false;
  }

  pc = new RTCPeerConnection({
    iceServers: [],
    bundlePolicy: 'max-bundle'
  });

  pc.addTransceiver('video', { direction: 'recvonly' });

  pc.ontrack = e => {
    // ── KEY FIX: assign srcObject then explicitly call play() ──
    video.srcObject = e.streams[0];
    tryPlay();

    status.textContent = 'Live';
    status.style.color = '#7fff7f';

    if (!statsStarted) {
      statsStarted = true;
      startStats(pc);
    }
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'failed' || s === 'disconnected') {
      status.textContent = 'Reconnecting…';
      status.style.color = '#ffcc00';
      setTimeout(startWebRTC, 2000);
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  let resp;
  try {
    resp = await fetch(WHEP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp
    });
  } catch (err) {
    status.textContent = 'MediaMTX unreachable — retrying…';
    status.style.color = '#ff6666';
    setTimeout(startWebRTC, 3000);
    return;
  }

  if (!resp.ok) {
    status.textContent = 'MediaMTX not ready — retrying…';
    status.style.color = '#ff6666';
    setTimeout(startWebRTC, 3000);
    return;
  }

  const answer = await resp.text();
  await pc.setRemoteDescription({ type: 'answer', sdp: answer });
}

// ── Live stats ────────────────────────────────────────────────
// Latency = capture timestamp embedded in RTP vs local clock.
// estimatedPlayoutTimestamp is in ms (DOMHighResTimestamp domain).
// We measure it as: now - (estimatedPlayoutTimestamp - timeOrigin)
// which gives the wall-clock delta between "frame was captured" and "now".
let prevBytes = 0, prevTs = 0, prevFrames = 0;

function startStats(pc) {
  setInterval(async () => {
    if (!pc || pc.connectionState !== 'connected') return;
    const reports = await pc.getStats();
    reports.forEach(r => {
      if (r.type === 'inbound-rtp' && r.kind === 'video') {
        const now     = r.timestamp;                       // ms, monotonic
        const dt      = Math.max((now - prevTs) / 1000, 0.001);
        const dBytes  = Math.max(r.bytesReceived  - prevBytes,  0);
        const dFrames = Math.max(r.framesDecoded  - prevFrames, 0);

        const fps    = (dFrames / dt).toFixed(1);
        const br     = ((dBytes * 8) / dt / 1000).toFixed(0);
        const jitter = (r.jitter * 1000).toFixed(1);
        const lost   = r.packetsLost ?? 0;
        const width  = r.frameWidth  ?? '—';
        const height = r.frameHeight ?? '—';

        // Latency: difference between local wall clock and estimated playout time
        // estimatedPlayoutTimestamp is a Unix-epoch ms value (not DOMHighResTimestamp)
        let latStr = '—';
        if (r.estimatedPlayoutTimestamp && r.estimatedPlayoutTimestamp > 1e12) {
          const latMs = Date.now() - r.estimatedPlayoutTimestamp;
          if (latMs > 0 && latMs < 5000) latStr = latMs.toFixed(0) + ' ms';
        }

        document.getElementById('sFps').textContent  = fps + ' fps';
        document.getElementById('sBr').textContent   = br  + ' kbps';
        document.getElementById('sJit').textContent  = jitter + ' ms';
        document.getElementById('sLoss').textContent = lost;
        document.getElementById('sRes').textContent  = `${width}×${height}`;
        document.getElementById('sLat').textContent  = latStr;

        prevBytes  = r.bytesReceived;
        prevTs     = now;
        prevFrames = r.framesDecoded;
      }
    });
  }, 1000);
}

// ── WebSocket for ANPR plate results ─────────────────────────
const ws = new WebSocket(`ws://${location.host}/ws`);

ws.onmessage = e => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'plate') {
    const li = document.createElement('li');
    const d  = msg.data;
    const t  = new Date(d.ts * 1000).toLocaleTimeString();
    li.innerHTML = `<span class="plate">${d.plate}</span>
                    <span class="conf">${(d.confidence*100).toFixed(0)}%&nbsp;&nbsp;${t}</span>`;
    const ul = document.getElementById('plateLog');
    ul.prepend(li);
    if (ul.children.length > 50) ul.removeChild(ul.lastChild);
  }
};

setInterval(() => ws.readyState === 1 && ws.send('ping'), 10000);

startWebRTC();
</script>
</body>
</html>
