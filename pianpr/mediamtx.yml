# ============================================================
# MediaMTX config — piANPR receiver
# Pi4 pushes MPEG-TS H.264 -> UDP:5555
# MediaMTX owns :5555, serves RTSP:8554 + WebRTC:8889
# ============================================================

logLevel: info
logDestinations: [stdout]

rtspAddress:    :8554
rtmpAddress:    :1935
webrtcAddress:  :8889
webrtcICEServers: []
hls:            no
hlsAddress:     :8888
record:         no

paths:
  gate:
    # MediaMTX listens on UDP:5555 for incoming MPEG-TS from Pi4
    source:                    udp://0.0.0.0:5555
    # Keep path alive even when no readers connected
    sourceOnDemand:            no
    # Wait up to 60 s for Pi4 to start sending
    sourceOnDemandStartTimeout: 60s
    sourceOnDemandCloseAfter:  0s
    readUser:
    readPass:
    overridePublisher: yes
