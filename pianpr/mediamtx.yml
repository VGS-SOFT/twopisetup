# ============================================================
# MediaMTX config for piANPR receiver
# Pi4 pushes MPEG-TS H.264 → piANPR UDP:5555
# MediaMTX listens on UDP:5555 and serves WebRTC WHEP on :8889
# Tested with MediaMTX v1.9.3
# ============================================================

logLevel: info
logDestinations: [stdout]

# WebRTC — browser gets stream from here
webrtcAddress: :8889
webrtcICEServers: []

# Disable unused protocols
rtspAddress:    :8554
rtmpAddress:    :1935
hls:            no
hlsAddress:     :8888
record:         no

paths:
  gate:
    # Pi4 pushes MPEG-TS into this UDP port
    # udpListener = MediaMTX binds and listens on this port
    source: udp://localhost:5555
    # No auth — LAN only
    readUser:
    readPass:
    overridePublisher: yes
